<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Skills</title>
<meta name="description" content="Run smarchone/skills productivity commands in the browser.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2315171d'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='%23a5b0ff' font-family='monospace'>/</text></svg>">
<style>
:root {
  --bg: #0d0e11; --panel: #14161b; --panel-2: #1a1d24; --line: #23262e; --line-2: #30343e;
  --text: #e4e6eb; --muted: #858a97; --faint: #5c616d; --accent: #9aa6ff; --accent-bg: rgba(154,166,255,.10);
  --warn: #e3b067;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); display: flex; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { color: var(--text); background: var(--panel-2); }
svg { display: block; }

/* Sessions sidebar: hidden until asked for */
#sidebar { width: 0; flex: none; overflow: hidden; background: var(--panel); border-right: 1px solid transparent; transition: width .18s ease; }
body.side-open #sidebar { width: 264px; border-right-color: var(--line); }
#sidebarInner { width: 264px; height: 100%; display: flex; flex-direction: column; }
.side-head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 16px; font-size: 13px; color: var(--muted); }
#sessionList { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.sess { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.sess:hover, .sess.active { background: var(--panel-2); }
.sess .meta { flex: 1; min-width: 0; }
.sess .cmd { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.sess .first { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess .del { opacity: 0; color: var(--faint); width: 22px; height: 22px; border-radius: 6px; }
.sess:hover .del { opacity: 1; }
.sess .del:hover { color: var(--text); background: var(--line); }
.side-empty { padding: 8px 10px; font-size: 13px; color: var(--faint); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
header { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
body:not(.landing) header { border-bottom: 1px solid var(--line); }
#hdrCmd { font-family: var(--mono); font-size: 13px; color: var(--accent); }
#hdrTitle { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hdrTurn { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.gh { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border: 1px solid var(--line-2); border-radius: 8px; color: var(--text); text-decoration: none; font-size: 13px; }
.gh:hover { background: var(--panel-2); }
.gh .repo { color: var(--muted); }

#scroll { flex: 1; overflow-y: auto; }
#thread { max-width: 720px; margin: 0 auto; padding: 32px 20px 40px; }
.msg { margin: 0 0 26px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: var(--panel-2); padding: 9px 14px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.msg.user .chip { font-family: var(--mono); color: var(--accent); margin-right: 6px; }
.md { word-wrap: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { line-height: 1.3; margin: 1.3em 0 .5em; font-weight: 600; }
.md h1 { font-size: 1.3em; } .md h2 { font-size: 1.15em; } .md h3 { font-size: 1.02em; }
.md code { font-family: var(--mono); font-size: .87em; background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; border-radius: 10px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0; padding-left: 14px; border-left: 2px solid var(--line-2); color: var(--muted); }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; }
.md hr { border: 0; border-top: 1px solid var(--line); }
.cursor::after { content: ""; display: inline-block; width: 7px; height: 1em; vertical-align: -2px; background: var(--muted); margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.notice { color: var(--warn); font-size: 14px; margin: 0 0 22px; }

.closing { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.closing .label { flex: 1; color: var(--muted); font-size: 14px; }
.btn { padding: 7px 13px; border-radius: 8px; font-size: 14px; border: 1px solid var(--line-2); }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
.btn.primary:hover { background: #fff; }

/* Composer */
#composerWrap { flex: none; padding: 0 20px 20px; }
#composer { position: relative; max-width: 720px; width: 100%; margin: 0 auto; }
#box { position: relative; display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 16px; transition: border-color .15s; }
#box:focus-within { border-color: var(--line-2); }
#chip { display: none; flex: none; font-family: var(--mono); font-size: 14px; color: var(--accent); background: var(--accent-bg); border-radius: 6px; padding: 1px 7px; margin-bottom: 2px; }
#chip.on { display: inline-block; }
#input { flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--text); font: inherit; max-height: 240px; padding: 2px 0; }
#input::placeholder { color: var(--faint); }
#sendBtn { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--text); color: var(--bg); display: grid; place-items: center; }
#sendBtn:disabled { background: var(--line); color: var(--faint); cursor: default; }
#hint { min-height: 20px; font-size: 12.5px; color: var(--faint); padding: 7px 4px 0; }

/* Command picker: names only; the selected one shows its description */
#popover { display: none; position: absolute; bottom: calc(100% + 8px); left: -1px; right: -1px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 5; }
#popover.on { display: block; }
.opt { padding: 7px 10px; border-radius: 8px; cursor: pointer; font-family: var(--mono); font-size: 14px; color: var(--muted); }
.opt.sel { background: var(--panel-2); color: var(--text); }
.pop-desc { border-top: 1px solid var(--line); margin-top: 6px; padding: 10px 10px 4px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.pop-desc a { color: var(--faint); text-decoration: none; margin-left: 4px; white-space: nowrap; }
.pop-desc a:hover { color: var(--text); }
.pop-empty { padding: 8px 10px; color: var(--faint); font-size: 13px; }

/* Landing: composer centered, nothing else competing */
#landingHead { display: none; }
body.landing #scroll { display: none; }
body.landing #composerWrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 14vh; }
body.landing #landingHead { display: block; max-width: 720px; width: 100%; margin: 0 auto 22px; padding: 0 4px; }
#landingHead h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.2px; }
#landingHead p { margin: 4px 0 0; color: var(--faint); font-size: 14px; }
body.landing #popover { bottom: auto; top: calc(100% + 8px); }
#examples { display: none; margin-top: 18px; }
body.landing #examples { display: block; }
.ex { display: flex; gap: 10px; width: 100%; text-align: left; padding: 7px 4px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.ex:hover { color: var(--text); }
.ex .c { font-family: var(--mono); color: var(--faint); flex: none; min-width: 140px; }
.ex:hover .c { color: var(--accent); }

@media (max-width: 760px) {
  body.side-open #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 10; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  #thread { padding: 22px 16px 32px; }
  #composerWrap { padding: 0 16px 14px; }
  #hdrTitle, .gh .repo { display: none; }
  .ex { flex-direction: column; gap: 0; }
}
</style>
</head>
<body class="landing">
<aside id="sidebar">
  <div id="sidebarInner">
    <div class="side-head">
      <span>Sessions</span>
      <button id="newBtn" class="icon-btn" title="New session" aria-label="New session">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </div>
    <nav id="sessionList"></nav>
  </div>
</aside>

<main id="main">
  <header>
    <button id="menuBtn" class="icon-btn" title="Sessions" aria-label="Toggle sessions">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3" width="13" height="12" rx="2"/><path d="M7 3v12"/></svg>
    </button>
    <span id="hdrCmd"></span>
    <span id="hdrTitle"></span>
    <span id="hdrTurn"></span>
    <button id="copyBtn" class="icon-btn" title="Copy as markdown" aria-label="Copy as markdown" hidden>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M3 10.5V3.8C3 3.4 3.4 3 3.8 3h6.7"/></svg>
    </button>
    <a class="gh" href="https://github.com/smarchone/skills" target="_blank" rel="noopener" title="Commands source on GitHub">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span class="repo">smarchone/skills</span>
    </a>
  </header>
  <div id="scroll"><div id="thread"></div></div>
  <div id="composerWrap">
    <div id="landingHead">
      <h1>Run a command on your problem.</h1>
      <p>Type <span style="font-family:var(--mono);color:var(--muted)">/</span> to pick one. Seven turns, then it concludes.</p>
    </div>
    <div id="composer">
      <div id="box">
        <span id="chip"></span>
        <textarea id="input" rows="1" placeholder="/command  your idea or question"></textarea>
        <button id="sendBtn" aria-label="Send" disabled>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M2.5 6.5L7 2l4.5 4.5"/></svg>
        </button>
        <div id="popover" role="listbox"></div>
      </div>
      <div id="hint"></div>
      <div id="examples"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const TURN_CAP_DEFAULT = 7;
const STORE_KEY = "simple-skills.sessions";
const CURRENT_KEY = "simple-skills.current";
const GITHUB = "https://github.com/smarchone/skills";

// Starting points for engineers. Clicking one fills the composer; nothing is sent.
const EXAMPLES = [
  ["feel", "a Postgres primary going from 5k to 50k writes/sec"],
  ["feel", "a 2 TB table migration with zero downtime"],
  ["feel", "a Kafka consumer group rebalancing during peak traffic"],
  ["nail-on-the-head", "optimistic vs pessimistic locking"],
  ["nail-on-the-head", "a transactional outbox vs CDC with Debezium"],
  ["nail-on-the-head", "gRPC streaming vs WebSockets"],
  ["few-shot", "Raft leader election"],
  ["few-shot", "Postgres MVCC and vacuum"],
  ["intuition", "consistent hashing"],
  ["intuition", "backpressure in stream processing"],
  ["product-panel", "a CLI that ranks the likely root causes of flaky CI tests from their logs"],
  ["intuition-panel", "an on-call copilot that drafts the incident timeline from Slack and PagerDuty"],
  ["chatxy", "a staff engineer at Stripe · designing an idempotent payments API · interviewing me"],
];

const $ = (id) => document.getElementById(id);
const els = {
  thread: $("thread"), scroll: $("scroll"), input: $("input"), chip: $("chip"), send: $("sendBtn"),
  popover: $("popover"), hint: $("hint"), list: $("sessionList"), hdrCmd: $("hdrCmd"),
  hdrTitle: $("hdrTitle"), hdrTurn: $("hdrTurn"), copy: $("copyBtn"), examples: $("examples"),
};

const state = {
  commands: [], turnCap: TURN_CAP_DEFAULT,
  sessions: load(),
  currentId: null,
  pendingCommand: null,
  popIndex: 0, popItems: [],
  streaming: false,
  notice: null,
};

// ---------- storage ----------
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.sessions)); localStorage.setItem(CURRENT_KEY, state.currentId || ""); } catch {}
}
const current = () => state.sessions.find((s) => s.id === state.currentId) || null;
const userTurns = (s) => s ? s.messages.filter((m) => m.role === "user").length : 0;
const isClosed = (s) => s && userTurns(s) >= state.turnCap && s.messages.at(-1)?.role === "assistant";
const cmdInfo = (name) => state.commands.find((c) => c.name === name);

marked.setOptions({ gfm: true, breaks: false });
const md = (text) => DOMPurify.sanitize(marked.parse(text || ""));

// ---------- render ----------
function render() {
  const s = current();
  document.body.classList.toggle("landing", !s);
  renderSidebar(); renderHeader(s); renderThread(s); renderComposer(s);
}

function renderSidebar() {
  els.list.innerHTML = "";
  const sorted = [...state.sessions].sort((a, b) => b.updatedAt - a.updatedAt);
  if (!sorted.length) els.list.innerHTML = `<div class="side-empty">No sessions yet.</div>`;
  for (const s of sorted) {
    const row = document.createElement("div");
    row.className = "sess" + (s.id === state.currentId ? " active" : "");
    row.innerHTML = `<div class="meta"><div class="cmd"></div><div class="first"></div></div><button class="del" title="Delete">×</button>`;
    row.querySelector(".cmd").textContent = `/${s.command}`;
    row.querySelector(".first").textContent = s.title;
    row.onclick = () => openSession(s.id);
    row.querySelector(".del").onclick = (e) => {
      e.stopPropagation();
      state.sessions = state.sessions.filter((x) => x.id !== s.id);
      if (state.currentId === s.id) state.currentId = null;
      save(); render();
    };
    els.list.appendChild(row);
  }
}

function renderHeader(s) {
  els.copy.hidden = !s || !s.messages.some((m) => m.role === "assistant");
  els.hdrCmd.textContent = s ? "/" + s.command : "";
  els.hdrTitle.textContent = s ? s.title : "";
  els.hdrTurn.textContent = !s ? "" : isClosed(s) ? "done" : `${Math.max(1, Math.min(userTurns(s), state.turnCap))}/${state.turnCap}`;
}

function noticeEl() { const n = document.createElement("div"); n.className = "notice"; n.textContent = state.notice; return n; }

function renderThread(s) {
  els.thread.innerHTML = "";
  if (!s) return;
  s.messages.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = "msg " + m.role;
    if (m.role === "user") {
      const b = document.createElement("div");
      b.className = "bubble";
      if (i === 0) { const c = document.createElement("span"); c.className = "chip"; c.textContent = "/" + s.command; b.appendChild(c); }
      b.appendChild(document.createTextNode(m.content));
      div.appendChild(b);
    } else {
      div.innerHTML = `<div class="md">${md(m.content)}</div>`;
    }
    els.thread.appendChild(div);
  });
  if (state.notice) els.thread.appendChild(noticeEl());
  if (isClosed(s)) els.thread.appendChild(closingRow());
}

function closingRow() {
  const row = document.createElement("div");
  row.className = "closing";
  row.innerHTML = `<span class="label">Session complete.</span>
    <button class="btn primary" data-a="copy">Copy as markdown</button>
    <button class="btn" data-a="new">New session</button>`;
  row.querySelector('[data-a="copy"]').onclick = (e) => copyMarkdown(e.target);
  row.querySelector('[data-a="new"]').onclick = newSession;
  return row;
}

function renderExamples() {
  els.examples.innerHTML = "";
  const pool = EXAMPLES.filter(([c]) => cmdInfo(c));
  // Four at random, one per command where possible.
  const picked = [], seen = new Set();
  for (const ex of pool.sort(() => Math.random() - 0.5)) {
    if (picked.length === 4) break;
    if (!seen.has(ex[0])) { picked.push(ex); seen.add(ex[0]); }
  }
  for (const [c, text] of picked) {
    const b = document.createElement("button");
    b.className = "ex";
    b.innerHTML = `<span class="c"></span><span class="t"></span>`;
    b.querySelector(".c").textContent = "/" + c;
    b.querySelector(".t").textContent = text;
    b.onclick = () => { state.pendingCommand = c; els.input.value = text; renderComposer(null); autosize(); els.input.focus(); };
    els.examples.appendChild(b);
  }
}

function renderComposer(s) {
  const closed = isClosed(s);
  els.chip.classList.toggle("on", !s && !!state.pendingCommand);
  els.chip.textContent = state.pendingCommand ? "/" + state.pendingCommand : "";
  els.input.disabled = closed || state.streaming;
  if (closed) els.input.placeholder = "Session complete";
  else if (s) els.input.placeholder = "Reply…";
  else if (state.pendingCommand) els.input.placeholder = cmdInfo(state.pendingCommand)?.hint || "Your idea or question";
  else els.input.placeholder = "/command  your idea or question";
  updateSend(); updateHint();
}

function updateSend() {
  const s = current();
  const text = els.input.value.trim();
  els.send.disabled = !(!state.streaming && !isClosed(s) && text.length > 0 && (s || state.pendingCommand || parseSlash(els.input.value)));
}

// Only speak when it matters.
function updateHint() {
  const s = current();
  const v = els.input.value;
  let h = "";
  if (!s && state.notice) h = state.notice;
  else if (s && !isClosed(s) && v.startsWith("/")) h = `This session runs /${s.command}. Start a new session to switch.`;
  else if (s && !isClosed(s) && !state.streaming && userTurns(s) === state.turnCap - 1) h = "Last turn. The command will conclude.";
  else if (!s && !state.pendingCommand && v.trim() && !v.startsWith("/")) h = "Start with a command: type /";
  els.hint.textContent = h;
  els.hint.style.color = !s && state.notice ? "var(--warn)" : "";
}

// ---------- command picker ----------
function parseSlash(v) {
  const m = v.match(/^\/([\w-]+)(?:\s+([\s\S]*))?$/);
  if (!m || !cmdInfo(m[1])) return null;
  return { name: m[1], rest: m[2] || "" };
}

function openPopover(filter) {
  const f = filter.toLowerCase();
  state.popItems = state.commands.filter((c) => c.name.includes(f));
  state.popIndex = Math.min(state.popIndex, Math.max(0, state.popItems.length - 1));
  els.popover.innerHTML = "";
  if (!state.popItems.length) {
    const e = document.createElement("div"); e.className = "pop-empty"; e.textContent = `No command matches /${filter}`;
    els.popover.appendChild(e);
  }
  state.popItems.forEach((c, i) => {
    const o = document.createElement("div");
    o.className = "opt"; o.setAttribute("role", "option"); o.textContent = "/" + c.name;
    o.onmousedown = (e) => { e.preventDefault(); chooseCommand(c.name); };
    o.onmouseenter = () => { state.popIndex = i; highlight(); };
    els.popover.appendChild(o);
  });
  if (state.popItems.length) {
    const d = document.createElement("div"); d.className = "pop-desc"; d.id = "popDesc";
    els.popover.appendChild(d);
  }
  els.popover.classList.add("on");
  highlight();
}
function highlight() {
  els.popover.querySelectorAll(".opt").forEach((o, i) => o.classList.toggle("sel", i === state.popIndex));
  const c = state.popItems[state.popIndex], d = $("popDesc");
  if (c && d) {
    d.textContent = c.description + " ";
    const a = document.createElement("a"); a.href = c.source; a.target = "_blank"; a.rel = "noopener"; a.textContent = "source ↗";
    a.onmousedown = (e) => e.stopPropagation();
    d.appendChild(a);
  }
}
const closePopover = () => els.popover.classList.remove("on");
const popoverOpen = () => els.popover.classList.contains("on");

function chooseCommand(name) {
  if (current()) { state.currentId = null; save(); }
  state.notice = null;
  state.pendingCommand = name;
  const parsed = parseSlash(els.input.value);
  els.input.value = parsed ? parsed.rest : (els.input.value.startsWith("/") ? "" : els.input.value);
  closePopover(); render(); els.input.focus(); autosize();
}

function syncPopover() {
  const v = els.input.value;
  if (!current() && !state.pendingCommand && /^\/[\w-]*$/.test(v)) openPopover(v.slice(1));
  else closePopover();
}

// ---------- sessions ----------
function newSession() {
  state.currentId = null; state.pendingCommand = null; state.notice = null;
  els.input.value = "";
  save(); render(); renderExamples(); els.input.focus();
  if (innerWidth < 760) document.body.classList.remove("side-open");
}
function openSession(id) {
  if (state.streaming) return;
  state.currentId = id; state.pendingCommand = null; state.notice = null;
  els.input.value = "";
  save(); render(); scrollToBottom();
  if (innerWidth < 760) document.body.classList.remove("side-open");
}

function submit() {
  if (els.send.disabled) {
    // No plain chat: a first message without a command opens the picker.
    if (!current() && !state.pendingCommand && els.input.value.trim() && !els.input.value.startsWith("/")) {
      state.popIndex = 0; openPopover("");
    }
    return;
  }
  let s = current();
  let text = els.input.value.trim();
  if (!s) {
    let command = state.pendingCommand;
    if (!command) { const p = parseSlash(text); command = p.name; text = p.rest.trim(); }
    if (!text) return;
    s = { id: crypto.randomUUID(), command, title: text.split("\n")[0].slice(0, 80), messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    state.sessions.push(s);
    state.currentId = s.id;
    state.pendingCommand = null;
  }
  s.messages.push({ role: "user", content: text });
  s.updatedAt = Date.now();
  state.notice = null;
  els.input.value = ""; autosize();
  save(); render(); scrollToBottom();
  runTurn(s);
}

// ---------- the Turn: POST the whole Session, read the SSE stream ----------
async function runTurn(s) {
  state.streaming = true;
  renderComposer(s);
  const holder = document.createElement("div");
  holder.className = "msg assistant";
  holder.innerHTML = `<div class="md cursor"></div>`;
  els.thread.appendChild(holder);
  scrollToBottom();
  const mdEl = holder.querySelector(".md");

  let reply = "", errorInfo = null, raf = 0;
  const paint = () => {
    raf = 0;
    const nearBottom = els.scroll.scrollHeight - els.scroll.scrollTop - els.scroll.clientHeight < 80;
    mdEl.innerHTML = md(reply);
    if (nearBottom) scrollToBottom();
  };

  try {
    const res = await fetch("/api/turn", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ command: s.command, messages: s.messages }),
    });
    if (!res.body) throw new Error("No response body");
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    outer: while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const evt = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let name = "message", data = "";
        for (const line of evt.split("\n")) {
          if (line.startsWith("event:")) name = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trimStart();
        }
        if (!data) continue;
        if (data === "[DONE]") break outer;
        let obj; try { obj = JSON.parse(data); } catch { continue; }
        if (name === "error") { errorInfo = obj; break outer; }
        const piece = obj.response ?? obj.choices?.[0]?.delta?.content ?? "";
        if (piece) { reply += piece; if (!raf) raf = requestAnimationFrame(paint); }
      }
    }
    if (!res.ok && !errorInfo) errorInfo = { kind: "http", message: `The server answered ${res.status}. Try again.` };
  } catch {
    if (!reply) errorInfo = { kind: "network", message: "Couldn't reach the server. Send again." };
  }
  cancelAnimationFrame(raf);

  if (reply.trim() && !errorInfo) {
    s.messages.push({ role: "assistant", content: reply });
  } else {
    // Keep the Session; put the failed message back so it can be resent later.
    const failed = s.messages.pop();
    if (!s.messages.length) {
      state.sessions = state.sessions.filter((x) => x.id !== s.id);
      state.currentId = null;
      state.pendingCommand = s.command;
    }
    els.input.value = failed?.content || "";
    state.notice = errorInfo?.message || "Empty reply. Send again.";
  }
  s.updatedAt = Date.now();
  state.streaming = false;
  save(); render(); autosize(); scrollToBottom();
  els.input.focus();
}

// ---------- copy ----------
function toMarkdown(s) {
  const out = [`# /${s.command}: ${s.title}`, ""];
  s.messages.forEach((m, i) => {
    if (m.role === "user") out.push(`**You:** ${i === 0 ? "/" + s.command + " " : ""}${m.content}`, "");
    else out.push(m.content, "", "---", "");
  });
  out.push(`_/${s.command} from ${GITHUB}_`);
  return out.join("\n");
}
async function copyMarkdown(btn) {
  const s = current(); if (!s) return;
  try { await navigator.clipboard.writeText(toMarkdown(s)); } catch {
    const ta = document.createElement("textarea"); ta.value = toMarkdown(s); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  const old = btn.title || btn.textContent;
  if (btn.tagName === "BUTTON" && btn.classList.contains("btn")) { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = old), 1400); }
  else { btn.style.color = "var(--accent)"; setTimeout(() => (btn.style.color = ""), 1400); }
}

// ---------- input wiring ----------
function autosize() { els.input.style.height = "auto"; els.input.style.height = Math.min(els.input.scrollHeight, 240) + "px"; }
function scrollToBottom() { els.scroll.scrollTop = els.scroll.scrollHeight; }

els.input.addEventListener("input", () => {
  if (!current() && !state.pendingCommand) {
    const p = parseSlash(els.input.value);
    if (p && /^\/[\w-]+\s/.test(els.input.value)) { chooseCommand(p.name); els.input.value = p.rest; }
  }
  if (state.notice && !current()) state.notice = null;
  syncPopover(); autosize(); updateSend(); updateHint();
});

els.input.addEventListener("keydown", (e) => {
  if (popoverOpen() && state.popItems.length) {
    const n = state.popItems.length;
    if (e.key === "ArrowDown") { e.preventDefault(); state.popIndex = (state.popIndex + 1) % n; highlight(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); state.popIndex = (state.popIndex - 1 + n) % n; highlight(); return; }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); chooseCommand(state.popItems[state.popIndex].name); return; }
  }
  if (e.key === "Escape" && popoverOpen()) { e.preventDefault(); closePopover(); return; }
  if (e.key === "Backspace" && !current() && state.pendingCommand && els.input.selectionStart === 0 && els.input.selectionEnd === 0) {
    e.preventDefault();
    const name = state.pendingCommand;
    state.pendingCommand = null;
    els.input.value = "/" + name + els.input.value;
    renderComposer(null); syncPopover();
    els.input.setSelectionRange(name.length + 1, name.length + 1);
    return;
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});
els.input.addEventListener("blur", () => setTimeout(closePopover, 120));
els.input.addEventListener("focus", syncPopover);
els.send.onclick = submit;
$("newBtn").onclick = newSession;
els.copy.onclick = () => copyMarkdown(els.copy);
$("menuBtn").onclick = () => document.body.classList.toggle("side-open");
els.scroll.addEventListener("click", () => { if (innerWidth < 760) document.body.classList.remove("side-open"); });

// ---------- boot ----------
(async function boot() {
  try {
    const r = await fetch("/api/commands");
    const j = await r.json();
    state.commands = j.commands; state.turnCap = j.turnCap || TURN_CAP_DEFAULT;
  } catch {
    state.notice = "Couldn't load the commands. Refresh to try again.";
  }
  const saved = localStorage.getItem(CURRENT_KEY);
  if (saved && state.sessions.some((s) => s.id === saved)) state.currentId = saved;
  render(); renderExamples(); scrollToBottom(); els.input.focus();
})();
</script>
